<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCFL A2 - Book 1 Vocabulary Master</title>
    <style>
        /* Base Styles & Reset */
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh;
            display: flex; 
            flex-direction: column;
            color: #fff;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand span {
            color: #00d2ff;
        }

        /* Centered Header Title */
        .header-title-container {
            flex: 1;
            text-align: center;
        }

        .header-title-container h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #a8c0ff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            margin: 0;
        }

        .lesson-selector {
            position: relative;
        }

        .lesson-select {
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 35px 8px 15px;
            font-size: 0.9rem;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .lesson-select:hover, .lesson-select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00d2ff;
        }

        .lesson-select option {
            background: #1e3c72;
            color: #fff;
            padding: 10px;
        }

        .select-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #fff;
            font-size: 0.7rem;
        }

        /* Progress Bar Section */
        .progress-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        
        .progress-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-bottom: 8px;
            height: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #00d2ff;
            width: 0%;
            transition: width 0.4s ease;
        }
        
        #card-counter {
            font-size: 0.85rem;
            color: #e0e0e0;
        }

        /* Main Content Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 20px 40px;
        }

        /* Responsive 3D Flashcard Scene */
        .card-scene { 
            perspective: 1500px; 
            width: 100%; 
            max-width: 850px; 
            /* Wider aspect ratio to match the screenshots */
            height: 45vh;
            min-height: 300px;
            max-height: 450px;
            cursor: pointer; 
            margin-bottom: 30px;
            margin-top: 20px;
        }
        
        .card { 
            width: 100%; 
            height: 100%; 
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d; 
            position: relative; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
        }
        
        .card.flipped { 
            transform: rotateY(180deg); 
        }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-radius: 16px; 
            padding: 30px; 
            background: #ffffff;
            color: #333;
        }
        
        .card-back { 
            transform: rotateY(180deg); 
            background: #f8fafc;
        }

        /* Flashcard Typography - Thinner Font Weight */
        .vocab-type {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #e2e8f0;
            color: #64748b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .word { 
            font-size: clamp(5rem, 10vw, 8rem); 
            /* Thinner font weight as requested */
            font-weight: 400; 
            color: #0f172a; 
            margin-bottom: 15px;
            text-align: center;
        }
        
        .pinyin { 
            font-size: clamp(2rem, 4vw, 3.5rem); 
            color: #3b82f6; 
            font-weight: 400;
            margin-bottom: 20px; 
            text-align: center;
        }
        
        .meaning { 
            font-size: clamp(1.5rem, 3vw, 2.5rem); 
            color: #334155; 
            font-weight: 400;
            text-align: center; 
            line-height: 1.4; 
            max-width: 90%;
        }
        
        .hint { 
            position: absolute; 
            bottom: 20px; 
            color: #cbd5e1; 
            font-size: 0.9rem; 
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .hint::before {
            content: "↻";
            font-size: 1.1rem;
        }

        /* Controls */
        .controls { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            width: 100%;
            max-width: 500px;
        }
        
        button { 
            font-size: 1rem; 
            font-weight: 500; 
            padding: 10px 20px; 
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2); 
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #prev-btn { 
            background: transparent; 
            color: rgba(255, 255, 255, 0.6); 
        }
        
        #prev-btn:hover:not(:disabled) { 
            background: rgba(255, 255, 255, 0.1); 
            color: #fff;
        }
        
        #next-btn { 
            background: #00d2ff; 
            color: #0f172a; 
            border-color: #00d2ff;
        }
        
        #next-btn:hover:not(:disabled) { 
            background: #00bce6; 
        }
        
        button:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px; }
            .header-title-container { order: 3; width: 100%; margin-top: 5px; }
            .header-title-container h1 { font-size: 1.5rem; }
            .lesson-select { width: 200px; }
            .card-scene { height: 40vh; min-height: 250px; margin-top: 10px; }
        }
    </style>
</head>

    let currentLesson = "1";
    let currentIndex = 0;
    let isFlipped = false;

    // DOM Elements
    const lessonTitleEl = document.getElementById("lesson-title");
    const frontTextEl = document.getElementById("front-text");
    const frontTypeEl = document.getElementById("front-type");
    const backPinyinEl = document.getElementById("back-pinyin");
    const backMeaningEl = document.getElementById("back-meaning");
    const backTypeEl = document.getElementById("back-type");
    const cardEl = document.getElementById("flashcard");
    const counterEl = document.getElementById("card-counter");
    const progressBarEl = document.getElementById("progress");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const lessonSelectEl = document.getElementById("lesson-select");

    function changeLesson() {
        currentLesson = lessonSelectEl.value;
        currentIndex = 0;
        isFlipped = false;
        cardEl.classList.remove("flipped");
        
        // Slight delay to allow flip animation to reset before changing content
        setTimeout(renderCard, 150);
    }

    function renderCard() {
        const lessonData = lessonsData[currentLesson];
        const flashcards = lessonData.flashcards;
        const card = flashcards[currentIndex];
        
        // Update Title
        lessonTitleEl.innerText = lessonData.title;

        // Update content
        frontTypeEl.innerText = card.type;
        frontTextEl.innerText = card.front;
        
        backTypeEl.innerText = card.type;
        backPinyinEl.innerText = card.pinyin;
        backMeaningEl.innerText = card.back;
        
        // Update UI state
        counterEl.innerText = `Card ${currentIndex + 1} of ${flashcards.length}`;
        const progressPercentage = ((currentIndex + 1) / flashcards.length) * 100;
        progressBarEl.style.width = `${progressPercentage}%`;
        
        // Button states
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === flashcards.length - 1;

        // Reset flip state if navigating
        if (isFlipped) {
            cardEl.classList.remove("flipped");
            isFlipped = false;
        }
    }

    function flipCard() {
        isFlipped = !isFlipped;
        if(isFlipped) {
            cardEl.classList.add("flipped");
        } else {
            cardEl.classList.remove("flipped");
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        }
    }

    function nextCard() {
        const flashcards = lessonsData[currentLesson].flashcards;
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            renderCard();
        }
    }

    // Keyboard navigation
    document.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowRight') {
            nextCard();
        } else if (event.key === 'ArrowLeft') {
            prevCard();
        } else if (event.key === ' ' || event.key === 'Spacebar') {
            event.preventDefault(); // Prevent page scroll
            flipCard();
        }
    });

    // Initialize the app
    renderCard();
</script>
